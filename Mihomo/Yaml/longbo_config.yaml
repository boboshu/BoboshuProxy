dns:
  # ipv6: false
  enable: true
  enhanced-mode: fake-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - "[2400:3200::1]"
    - "[2402:4e00::]"
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    # - 223.5.5.5
    # - 119.29.29.29
  fallback: []
  fake-ip-filter:
    - "*"
    # rule-set 仅支持 behavior 为 domain/classical
    - "rule-set:clash_fake_ip_filter"
    - "rule-set:private"
  use-hosts: true
  use-system-hosts: true


# 节点筛选
# 按地区筛选
FilterHK: &FilterHK '(HK|香港|[Hh][Kk]|Hong\s*Kong)'
FilterTW: &FilterTW "(TW|台[湾灣]|[Tt][Ww]|Taiwan)"
FilterUS: &FilterUS '(US|美[国國]|America|United\s*States|[Uu][Ss])'
FilterJP: &FilterJP "(JP|日本|东京|大阪|[Jj][Pp]|Japan)"
FilterSG: &FilterSG "(SG|新加坡|狮城|[Ss][Gg]|Singapore)"

### 策略组基础配置
# 手动选择
Select:
  &Select {
    type: select,
    url: "http://connectivitycheck.platform.hicloud.com/generate_204",
    disable-udp: false,
    hidden: false,
    include-all: true,
  }
# 自动选择 [每 300 秒一次惰性健康检查，容差 50ms，时延超过 2 秒判定为失败，失败 3 次自动触发健康检查]
UrlTest:
  &UrlTest {
    type: url-test,
    url: "http://connectivitycheck.platform.hicloud.com/generate_204",
    interval: 300,
    lazy: true,
    tolerance: 50,
    timeout: 2000,
    disable-udp: false,
    max-failed-times: 3,
    hidden: true,
    include-all: true,
  }
# 自动回退 [每 300 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次自动触发健康检查]
FallBack:
  &FallBack {
    type: fallback,
    url: "http://connectivitycheck.platform.hicloud.com/generate_204",
    interval: 300,
    lazy: true,
    timeout: 2000,
    disable-udp: false,
    max-failed-times: 3,
    hidden: true,
    include-all: true,
  }
# 负载均衡 [每 300 秒一次惰性健康检查，时延超过 2 秒判定为失败，失败 3 次则自动触发健康检查]
LoadBalance:
  &LoadBalance {
    type: load-balance,
    url: "http://connectivitycheck.platform.hicloud.com/generate_204",
    interval: 300,
    lazy: true,
    disable-udp: false,
    strategy: consistent-hashing,
    timeout: 2000,
    max-failed-times: 3,
    hidden: true,
    include-all: true,
  }

# 策略组
proxy-groups:
  # 主选择组
  - {
      name: 节点选择,
      type: select,
      proxies: [智能选择, 手动选择, 全部节点, DIRECT],
      url: http://connectivitycheck.platform.hicloud.com/generate_204,
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Static.png,
    }

  # 手动/Auto
  - {
      name: 手动选择,
      type: select,
      proxies:
        [HK-手动选择, JP-手动选择, SG-手动选择, US-手动选择, TW-手动选择],
      url: http://connectivitycheck.platform.hicloud.com/generate_204,
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Cylink.png,
    }
  - {
      name: 智能选择,
      type: select,
      proxies: [HK-Auto, JP-Auto, SG-Auto, US-Auto, TW-Auto],
      url: http://connectivitycheck.platform.hicloud.com/generate_204,
      icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Urltest.png,
    }

  - name: Telegram
    type: select
    proxies: [节点选择, US-Auto, HK-Auto, JP-Auto, SG-Auto, DIRECT]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Telegram.png

  # 关于 CDN 的节点，尽可能选更快以及更便宜的节点（比如低倍的）
  # 当然，有些情况可以直连
  - name: CDN节点
    type: select
    proxies: [节点选择, DIRECT, HK-Auto, JP-Auto, SG-Auto, US-Auto]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Skicat.png

  # 关于 CDN 的节点，尽可能选更快以及更便宜的节点（比如低倍的）
  # 当然，有些情况可以直连
  - name: 下载CDN节点
    type: select
    proxies: [DIRECT, 节点选择, HK-Auto, JP-Auto, SG-Auto, US-Auto]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Thunder.png

  # 避免 HK 的一些推荐和骗子
  - name: Twitter
    type: select
    proxies: [节点选择, US-Auto, HK-Auto, JP-Auto, SG-Auto, DIRECT]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Twitter.png

  # 我 Spotify 注册的就是日区
  - name: Spotify
    type: select
    proxies: [节点选择, US-Auto, HK-Auto, JP-Auto, SG-Auto, DIRECT]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Spotify.png

  - name: YouTube
    type: select
    proxies: [HK-Auto, 节点选择, JP-Auto, SG-Auto, US-Auto, DIRECT]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/YouTube.png

  # 默认国区
  - name: Bilibili
    type: select
    proxies: [DIRECT, 节点选择, HK-Auto, JP-Auto, SG-Auto, US-Auto]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Bili.png

  - name: TikTok
    type: select
    proxies: [节点选择, US-Auto, HK-Auto, JP-Auto, SG-Auto, DIRECT]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/TikTok.png

  - name: Amazon
    type: select
    proxies: [节点选择, US-Auto, HK-Auto, JP-Auto, SG-Auto, DIRECT]
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Amazon.png

  # AIGC 屏蔽港澳台
  - name: AIGC
    type: select
    proxies: [节点选择, US-Auto, HK-Auto, JP-Auto, SG-Auto, DIRECT]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png

  - name: 苹果服务
    type: select
    proxies: [DIRECT, 节点选择, HK-Auto, JP-Auto, SG-Auto, US-Auto]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Apple.png

  - name: 微软服务
    type: select
    proxies: [DIRECT, 节点选择, HK-Auto, JP-Auto, SG-Auto, US-Auto]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Microsoft.png

  - name: 漏网之鱼
    type: select
    proxies: [DIRECT, 节点选择, HK-Auto, JP-Auto, SG-Auto, US-Auto]
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Final.png

  # Auto
  - {
      name: HK-Auto,
      type: select,
      proxies: [HK-自动选择, HK-自动回退, HK-负载均衡],
    }
  - {
      name: JP-Auto,
      type: select,
      proxies: [JP-自动选择, JP-自动回退, JP-负载均衡],
    }
  - {
      name: SG-Auto,
      type: select,
      proxies: [SG-自动选择, SG-自动回退, SG-负载均衡],
    }
  - {
      name: US-Auto,
      type: select,
      proxies: [US-自动选择, US-自动回退, US-负载均衡],
    }
  - {
      name: TW-Auto,
      type: select,
      proxies: [TW-自动选择, TW-自动回退, TW-负载均衡],
    }

  # 自动选择 - 按地区
  - { name: HK-自动选择, <<: *UrlTest, filter: *FilterHK }
  - { name: JP-自动选择, <<: *UrlTest, filter: *FilterJP }
  - { name: SG-自动选择, <<: *UrlTest, filter: *FilterSG }
  - { name: US-自动选择, <<: *UrlTest, filter: *FilterUS }
  - { name: TW-自动选择, <<: *UrlTest, filter: *FilterTW }

  # 自动回退 - 按地区
  - { name: HK-自动回退, <<: *FallBack, filter: *FilterHK }
  - { name: JP-自动回退, <<: *FallBack, filter: *FilterJP }
  - { name: SG-自动回退, <<: *FallBack, filter: *FilterSG }
  - { name: US-自动回退, <<: *FallBack, filter: *FilterUS }
  - { name: TW-自动回退, <<: *FallBack, filter: *FilterTW }

  # 负载均衡 - 按地区
  - { name: HK-负载均衡, <<: *LoadBalance, filter: *FilterHK }
  - { name: JP-负载均衡, <<: *LoadBalance, filter: *FilterJP }
  - { name: SG-负载均衡, <<: *LoadBalance, filter: *FilterSG }
  - { name: US-负载均衡, <<: *LoadBalance, filter: *FilterUS }
  - { name: TW-负载均衡, <<: *LoadBalance, filter: *FilterTW }

  # 手动选择 - 按地区
  - { name: HK-手动选择, <<: *Select, filter: *FilterHK }
  - { name: JP-手动选择, <<: *Select, filter: *FilterJP }
  - { name: SG-手动选择, <<: *Select, filter: *FilterSG }
  - { name: US-手动选择, <<: *Select, filter: *FilterUS }
  - { name: TW-手动选择, <<: *Select, filter: *FilterTW }

  - { name: 全部节点, <<: *Select }

# 规则参数 [每12小时更新一次订阅规则，更新规则时使用（节点选择）策略]
RuleSet_classical:
  &RuleSet_classical {
    type: http,
    behavior: classical,
    interval: 43200,
    format: text,
    proxy: 节点选择,
  }
RuleSet_domain:
  &RuleSet_domain {
    type: http,
    behavior: domain,
    interval: 43200,
    format: text,
    proxy: 节点选择,
  }
RuleSet_ipcidr:
  &RuleSet_ipcidr {
    type: http,
    behavior: ipcidr,
    interval: 43200,
    format: text,
    proxy: 节点选择,
  }
RuleSet_domain_mrs:
  &RuleSet_domain_mrs {
    type: http,
    behavior: domain,
    interval: 43200,
    format: mrs,
    proxy: DIRECT,
  }

